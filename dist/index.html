d a parish among Singapore’s first public housing estate."},{year:"1963",title:"Damien Hall",description:"The first building is completed and opened on 7 November as a temporary church and lodging. It is named for St Damien of Molokai, the SS.CC priest who gave his life among the people of Kalaupapa. Variety shows, film nights, and even circus proceeds help raise the rest."},{year:"1965",title:"A tent of meeting",description:"On 8 May Archbishop Olçomendy blesses the main church, designed by Y. Gordon Dowsett of Van Sitteren and Partners. The folded blue roof — inverted pleats of a biblical tent — gathers some 1,500 worshippers on a cruciform plan, with glass at the roof joints lighting the sanctuary."},{year:"1970–1984",title:"Queenstown fills the pews",description:"Under Fr Albert Renckens the congregation swells toward 6,000, then nearly 7,000 by the 1980s. Sunday Mass is followed by breakfast in Damien Hall. The Parish Renewal Experience begins in 1984; Life in the Spirit seminars and a Youth Lenten campaign for the poor take root."},{year:"1982",title:"Damien Centre",description:"A new centre opens to hold the expanding life of the parish — formation, fellowship, and the kindergarten that will become Little Shepherds’ Schoolhouse."},{year:"2005–2007",title:"A conserved house of prayer",description:"The Urban Redevelopment Authority grants conservation status in 2005, protecting the iconic tent roof. Father Damien Centre is rebuilt and opened on 22 September 2007 by Monsignor Eugene Vaz, still home to Little Shepherds’ Schoolhouse."},{year:"2019–2023",title:"Tent of Meeting Restoration",description:"Fr Johan Wongso launches TOMR in March 2019 — not only a $9.4 million restoration of roof, pews, sacristy, air and sound, but a spiritual restoration of the parish. Masses move to Damien Hall. The church reopens in October–November 2023 with an eight-day Threefold Celebration."},{year:"2023–2026",title:"A Eucharistic spirituality",description:"On Corpus Christi 2023 the parish receives its mission: to be an evangelising church with a Eucharistic spirituality. Oliver Wihardja’s Stations of the Cross keep watch on the walls. English, Mandarin, Tamil, Indonesian and Tagalog still gather under the blue tent."}],h1=[{id:"main-church",title:"Main Church",summary:"The Tent of Meeting — a conserved modernist nave under a folded blue roof, where glass at the roof joints lights the crucifix and tabernacle.",details:["Cruciform plan by Y. Gordon Dowsett, Van Sitteren and Partners","Celtic cross on the exterior brick wall behind the altar","Stations of the Cross by Oliver Wihardja (2023 restoration)","Weekend Masses from Saturday 6.00 p.m. through Sunday 5.30 p.m."],image:oe.naveCdn,imageFallback:oe.sanctuary,imageAlt:"Sanctuary of Blessed Sacrament Church looking toward the altar and crucifix"},{id:"chapel",title:"Adoration Chapel",summary:"A quieter house beside the nave. Come and spend some time before the Blessed Sacrament — the parish’s name is also its centre of gravity.",details:["Open daily, 9.00 a.m. to 9.00 p.m.","First Friday Sacred Heart devotion at 7.00 p.m.","First Saturday Immaculate Heart devotion at 9.00 a.m.","No appointment needed for a visit of prayer"],image:oe.chapel,imageFallback:oe.chapel,imageAlt:"Quiet adoration chapel with a golden monstrance and votive candles"},{id:"rosary-garden",title:"Father Damien Centre",summary:"Named for St Damien of Molokai. The hall that first held Mass in 1963 still gathers catechesis, Little Shepherds’ Schoolhouse, and the life of the parish.",details:["Opened 7 November 1963 as the first house of worship","Rebuilt and blessed 22 September 2007 by Monsignor Eugene Vaz","Home to Little Shepherds’ Schoolhouse","Formation rooms, hospitality, and weekday parish life"],image:oe.courtyardCdn,imageFallback:oe.garden,imageAlt:"Tropical courtyard and grounds beside Blessed Sacrament Church"}],dc=[{id:"liturgical",title:"Liturgical",summary:"Servers, singers, readers, and hospitality ministers who help the assembly pray the Mass with dignity — not merely performing functions, but keeping a sense of the sacred.",details:["Altar servers assisting the SS.CC fathers","Choirs across the weekend Masses, including Mandarin, Tamil, Indonesian and Tagalog","Readers, extraordinary ministers, and sacristans","Hospitality: no visitor should leave unnoticed"],image:oe.sanctuary,imageFallback:oe.sanctuary,imageAlt:"Church sanctuary prepared for the celebration of Mass"},{id:"faith-formation",title:"Faith Formation",summary:"Catechesis that begins in childhood and does not stop at confirmation — forming disciples whose centre is the Eucharist.",details:["Parish catechism for children and confirmation","RCIA for adults seeking baptism and full communion","Little Shepherds’ Schoolhouse on the Damien Centre grounds","Adult formation, Scripture, and Life in the Spirit"],image:oe.hall,imageFallback:oe.hall,imageAlt:"Parish hall prepared for catechesis and formation"},{id:"pastoral-care",title:"Pastoral Care",summary:"Outreach that meets Christ in the poor, the sick, and the grieving — the same charity St Damien practised on Molokai.",details:["Home and hospital visitation","Bereavement ministry and funeral support","Care for the poor and needy of Queenstown","Write bsc.pastoral@catholic.org.sg"],image:oe.cemetery,imageFallback:oe.cemetery,imageAlt:"Quiet memorial garden on the church grounds at dawn"},{id:"family-life",title:"Family Life",summary:"Accompanying households from the font to the altar — baptism, marriage preparation, and the slow work of domestic church.",details:["Infant baptism enquiry through the parish office","Marriage preparation and Nuptial Mass","Family catechesis and parenting formation","Enquire at bsc.secretariat@catholic.org.sg"],image:oe.garden,imageFallback:oe.garden,imageAlt:"Marian courtyard garden beside the church"},{id:"youth",title:"Youth",summary:"Young people of Queenstown gathering around the Eucharist — not a programme to occupy them, but a place to belong and be sent.",details:["Youth pastoral associate: Ms Mendoza Alyzza Miclat","Confirmation journey and youth Mass involvement","Service, retreats, and peer formation","Write bsc.youthpastoral@catholic.org.sg"],image:oe.feast,imageFallback:oe.feast,imageAlt:"Parishioners processing with the Blessed Sacrament on the feast of Corpus Christi"},{id:"mandarin",title:"Language Communities",summary:"A parish that prays in five tongues under one tent — Mandarin at dawn, English through the day, Tamil, Indonesian and Tagalog around the table.",details:["Mandarin Mass every Sunday at 7.30 a.m.","Tamil Mass on the 3rd Saturday at 7.30 p.m.","Indonesian Mass on the last Sunday at 1.00 p.m. (KKIS)","Tagalog Mass at 3.15 p.m. (English on the 3rd Sunday)"],image:oe.glass,imageFallback:oe.glass,imageAlt:"Coloured stained glass throwing light across the nave"}],m1=[{question:"What are the Mass times?",answer:"Weekdays 8.30 a.m., 12.30 p.m. and 6.30 p.m. Saturday 8.30 a.m. and 6.00 p.m. English sunset (Tamil 7.30 p.m. on the 3rd Saturday). Sunday 7.30 a.m. Mandarin, 9.00 a.m. and 11.00 a.m. English, 1.00 p.m. Indonesian on the last Sunday, 3.15 p.m. Tagalog (English on the 3rd Sunday), and 5.30 p.m. English. Public holidays: 8.30 a.m. only."},{question:"When can I go to confession?",answer:"Weekdays after the 8.30 a.m. Mass and 15 minutes before the 12.30 p.m. and 6.30 p.m. Masses. Saturday after 8.30 a.m. Mass and from 5.45 p.m. Sunday at 7.15 a.m., 8.45 a.m., 10.45 a.m. and 5.15 p.m."},{question:"How do I get there?",answer:"The nearest MRT is Commonwealth (EW20), about a 15-minute walk. Buses stop at Aft C’wealth Drive (11041) and Opp Blessed Sacrament Ch (11049). The church is at 1 Commonwealth Drive, Singapore 149603, along Queensway facing Commonwealth Drive."},{question:"Is there parking?",answer:"Parking within the compound is limited. Public car parks are a short walk away. Allow extra time on weekends, especially around the 9.00 a.m. and 11.00 a.m. English
